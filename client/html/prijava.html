<!DOCTYPE html>
<html lang="bs-BA">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="description" content="Prijavite se na svoj Domus profil.">
    <title>Prijava — Domus</title>
    <link rel="stylesheet" href="../style/site.css">
    <link rel="stylesheet" href="../style/prijava.css">
</head>
<body>
    <header id="site-header"></header>
    <main class="auth-page">
    <div class="auth-intro"><a class="brand brand--auth" href="index.html"><span class="brand__mark">D</span><span>Domus</span></a><p class="eyebrow">Dobro došli nazad</p><h1>Nastavite potragu za pravim prostorom.</h1><p>Pratite upite, ponude i oglase kroz svoj sigurni korisnički profil.</p></div>
    <div class="login-container">
        <p class="eyebrow">Pristup profilu</p><h2>Prijava</h2>
        <form id="loginForm">
            <div class="form-group">
                <label for="username">Korisničko ime</label>
                <input type="text" id="username" name="username" required>
            </div>
            
            <div class="form-group">
                <label for="password">Lozinka</label>
                <input type="password" id="password" name="password" required>
            </div>
            
            <button type="submit" id="dugme">Prijavi se</button>
        </form>
        
        <div id="areaBelow"></div>
        <p class="link-registracija">Nemate nalog? <a href="registracija.html">Registrujte se</a></p>
    </div></main>

    <script src="../scripts/api/PoziviAjax.js"></script>
    <script src="../scripts/components/siteHeader.js"></script>
    <script src="../scripts/pages/prijava.js"></script>
</body>
</html>
