<!DOCTYPE html>
<html lang="bs-BA">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Administracija — Domus</title>
    <link rel="stylesheet" href="../style/site.css">
    <link rel="stylesheet" href="../style/admin.css">
    <link rel="stylesheet" href="../style/workspace.css">
</head>
<body>
    <header id="site-header"></header><main class="workspace-page"><div class="admin-container">
        <div class="workspace-heading"><p class="eyebrow">Upravljanje portalom</p><h1>Administracija</h1><p>Pregled korisnika, nekretnina i aktivnosti na platformi.</p></div>

        <div id="dashboard-kartice" class="dashboard-kartice"></div>

        <div class="tabovi">
            <button type="button" class="tab-dugme aktivan" data-tab="korisnici">Korisnici</button>
            <button type="button" class="tab-dugme" data-tab="nekretnine">Nekretnine</button>
            <button type="button" class="tab-dugme" data-tab="zahtjevi">Zahtjevi</button>
            <button type="button" class="tab-dugme" data-tab="ponude">Ponude</button>
            <button type="button" class="tab-dugme" data-tab="komentari">Komentari</button>
        </div>

        <div id="tab-korisnici" class="tab-sadrzaj aktivan"><div id="korisnici-tabela"></div></div>
        <div id="tab-nekretnine" class="tab-sadrzaj"><div id="nekretnine-tabela"></div></div>
        <div id="tab-zahtjevi" class="tab-sadrzaj"><div id="zahtjevi-tabela"></div></div>
        <div id="tab-ponude" class="tab-sadrzaj"><div id="ponude-tabela"></div></div>
        <div id="tab-komentari" class="tab-sadrzaj"><div id="komentari-tabela"></div></div>
    </div></main>

    <script src="../scripts/utils/helpers.js"></script>
    <script src="../scripts/api/PoziviAjax.js"></script>
    <script src="../scripts/components/siteHeader.js"></script>
    <script src="../scripts/pages/admin.js"></script>
</body>
</html>
