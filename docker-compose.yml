
services:
  mysql:
    image: mysql:8.0
    container_name: nekretnine_mysql
    restart: always
    environment:
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD:-change_me_for_development}
      MYSQL_DATABASE: ${DB_NAME:-wt24}
      MYSQL_USER: ${DB_USER:-nekretnine_app}
      MYSQL_PASSWORD: ${DB_PASSWORD:-change_me_for_development}
    ports:
      - "3306:3306"
    volumes:
      - mysql_data:/var/lib/mysql
    networks:
      - nekretnine_network
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost"]
      timeout: 20s
      interval: 5s
      retries: 10

  app:
    build: .
    container_name: nekretnine_app
    restart: always
    ports:
      - "3000:3000"
    environment:
      DB_HOST: mysql
      DB_PORT: 3306
      DB_NAME: ${DB_NAME:-wt24}
      DB_USER: ${DB_USER:-nekretnine_app}
      DB_PASSWORD: ${DB_PASSWORD:-change_me_for_development}
      SESSION_SECRET: ${SESSION_SECRET:-development_only_change_me}
      NODE_ENV: development
    depends_on:
      mysql:
        condition: service_healthy
    volumes:
      - ./server:/app/server
      - ./uploads:/app/uploads
    networks:
      - nekretnine_network
    command: node server/index.js

volumes:
  mysql_data:

networks:
  nekretnine_network:
    driver: bridge
